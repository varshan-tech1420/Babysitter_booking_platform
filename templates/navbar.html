{% extends "base.html" %}

{% block content %}

<div class="login-page">

    <div class="login-card">

        <h1>Welcome Back 👋</h1>

        <p class="subtitle">
            Login to your babysitter booking account.
        </p>

        {% if error %}
            <div class="error-message">
                {{ error }}
            </div>
        {% endif %}

        <form method="POST">

            {% csrf_token %}

            <div class="form-group">

                <label for="username">
                    Username
                </label>

                <input
                    type="text"
                    name="username"
                    id="username"
                    placeholder="Enter username"
                    required
                >

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    name="password"
                    id="password"
                    placeholder="Enter password"
                    required
                >

            </div>


            <button type="submit">
                Login
            </button>

        </form>


        <p class="register-text">

            Don't have an account?

            <a href="/register/">
                Create Account
            </a>

        </p>

    </div>

</div>


<style>

.login-page {
    min-height: 70vh;

    display: flex;
    justify-content: center;
    align-items: center;

    padding: 40px 20px;
}

.login-card {
    width: 100%;
    max-width: 420px;

    background: white;

    padding: 35px;

    border-radius: 14px;

    box-shadow:
        0 5px 20px rgba(0, 0, 0, 0.08);
}

.login-card h1 {
    text-align: center;
    margin-bottom: 8px;
}

.subtitle {
    text-align: center;
    color: #666;

    margin-bottom: 30px;
}

.form-group {
    margin-bottom: 20px;
}

.form-group label {
    display: block;

    margin-bottom: 7px;

    font-weight: 600;
}

.form-group input {
    width: 100%;

    padding: 12px;

    border: 1px solid #d1d5db;

    border-radius: 7px;

    font-size: 15px;
}

.form-group input:focus {
    outline: none;

    border-color: #2563eb;
}

.login-card button {
    width: 100%;

    padding: 12px;

    border: none;

    border-radius: 7px;

    background: #2563eb;

    color: white;

    font-size: 16px;

    font-weight: 600;

    cursor: pointer;
}

.login-card button:hover {
    background: #1d4ed8;
}

.error-message {
    background: #fee2e2;

    color: #b91c1c;

    padding: 10px;

    border-radius: 7px;

    margin-bottom: 20px;

    text-align: center;
}

.register-text {
    text-align: center;

    margin-top: 22px;

    color: #666;
}

.register-text a {
    color: #2563eb;

    text-decoration: none;

    font-weight: 600;
}

</style>

{% endblock %}
